services:
  personal-ai-gateway:
    image: ghcr.io/brunoomarcel/personal-ai-gateway:latest
    environment:
      NODE_ENV: production
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3333}
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/gateway.db}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN must be set in Portainer}
      PROVIDER: ${PROVIDER:-authorized}
      OAUTH_STORAGE_KEY: ${OAUTH_STORAGE_KEY:?OAUTH_STORAGE_KEY must be set in Portainer}
      DASHBOARD_URL: ${DASHBOARD_URL:?DASHBOARD_URL must be set in Portainer}
    volumes:
      - gateway_data:/app/data
    networks:
      - gateway_network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=${TRAEFIK_NETWORK:-vpsnet}
        - traefik.swarm.network=${TRAEFIK_NETWORK:-vpsnet}
        - traefik.http.routers.personal-ai-gateway.rule=Host(`${DOMAIN:-personal-ai-gateway.medainer.com.br}`)
        - traefik.http.routers.personal-ai-gateway.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
        - traefik.http.routers.personal-ai-gateway.tls=true
        - traefik.http.routers.personal-ai-gateway.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencryptresolver}
        - traefik.http.services.personal-ai-gateway.loadbalancer.server.port=3333

volumes:
  gateway_data:

networks:
  gateway_network:
    external: true
    name: ${TRAEFIK_NETWORK:-vpsnet}

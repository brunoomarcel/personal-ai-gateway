services:
  personal-ai-gateway:
    build: .
    container_name: personal-ai-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3333}
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/gateway.db}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN must be set in .env}
      PROVIDER: ${PROVIDER:-authorized}
      OAUTH_STORAGE_KEY: ${OAUTH_STORAGE_KEY:?OAUTH_STORAGE_KEY must be set in .env}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3333}
    ports:
      - "3333:3333"
    volumes:
      - ./data:/app/data

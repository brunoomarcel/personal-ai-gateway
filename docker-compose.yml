services:
  personal-ai-gateway:
    build: .
    container_name: personal-ai-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      DATABASE_PATH: /app/data/gateway.db
      DASHBOARD_URL: http://localhost:3333
    ports:
      - "3333:3333"
    volumes:
      - ./data:/app/data
